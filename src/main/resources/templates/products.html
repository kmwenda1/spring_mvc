<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>
<body>
<h1>Products</h1>
<ul>
    <li th:each="p : ${products}" th:text="${p.name} + ' - $' + ${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}">
        Sample product
    </li>
</ul>
</body>
</html>
