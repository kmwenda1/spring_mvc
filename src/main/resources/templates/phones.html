<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Phones</title>
</head>
<body>
<h1>Phones</h1>

<form th:action="@{/logout}" method="post">
    <input type="submit" value="Sign Out"/>
</form>

<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>Brand</th>
        <th>Model</th>
        <th>Price</th>
        <th>In stock</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="phone : ${phones}">
        <td th:text="${phone.brand}">Brand</td>
        <td th:text="${phone.model}">Model</td>
        <td th:text="'$' + ${#numbers.formatDecimal(phone.price, 1, 2)}">$0.00</td>
        <td th:text="${phone.stock}">0</td>
    </tr>
    </tbody>
</table>
</body>
</html>
